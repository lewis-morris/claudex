[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "claudex"
version = "0.2.0"
description = "One lead plans the job; Claude Code and Codex each do the parts they're best at, check each other's work, and share one memory. With two cheeky monkeys."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["prompt_toolkit>=3.0.40"]
keywords = ["claude-code", "codex", "agents", "orchestration", "acp", "tui", "cli"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
]

[project.scripts]
claudex = "claudex.__main__:main"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["claudex"]

[tool.hatch.build.targets.sdist]
include = ["claudex", "tests", "docs", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
