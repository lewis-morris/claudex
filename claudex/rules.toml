# Claudex routing rules (`claudex rules` shows them, `claudex rules --edit` opens this file). Edit freely: they are re-read on every message.
# Model names are checked against what each agent offers right now, so a renamed
# or retired model falls back to that agent's default instead of failing.

[lead]
# The planner that splits a job, picks who does each part, and does the final check
# (architect / technical lead = Claude Opus 5.5, high).
agent = "claude"
model = "opus"
effort = "high"

[reviewers]
# Each side checks the other's work and gives second opinions on the other's big decisions
# (code reviewer = Claude Opus 5.5 / GPT-6 Astra, high).
claude = { model = "opus", effort = "high" }
codex = { model = "gpt-6-astra", effort = "high" }

[review]
enabled = true
max_attempts = 3          # 1st try, fix once at the same level, then one step up the ladder
skip_low_effort = false   # true: low-effort steps aren't reviewed (cheaper, less safe)
diff_limit = 60000        # characters of diff sent to the reviewer (it's told if it was cut short)

[checks]
if_unavailable = "stop"   # if a review/second opinion can't run (login, model, timeout): "stop" or "continue"

[final_check]
enabled = true            # after a job with more than one step, the lead checks the parts fit together

[memory]
update_map = true         # refresh .claudex/project/map.md after a job that changed files
map_model = { agent = "codex", model = "gpt-6.1-sol", effort = "low" }

[limits]
plan_timeout_min = 10
check_timeout_min = 15
step_timeout_min = 60
usage_limit_wait_min = 30   # after an agent hits its usage limit, route around it for this long

[ladder]
# Where a worker steps up to when its work keeps failing review. Never Max.
codex = [["gpt-6.1-sol", "low"], ["gpt-6.1-sol", "medium"], ["gpt-6.1-sol", "high"], ["gpt-6-astra", "high"], ["gpt-6-astra", "xhigh"]]
claude = [["sonnet", "medium"], ["sonnet", "high"], ["opus", "medium"], ["opus", "high"], ["opus", "xhigh"]]

[defaults]
# Used when no rule clearly fits.
agent = "codex"
model = "gpt-6.1-sol"
effort = "medium"

[agent_defaults]
# Used when you force one agent ("Claude only" / "Codex only", or start with @claude / @codex).
claude = { model = "opus", effort = "medium" }
codex = { model = "gpt-6.1-sol", effort = "medium" }

[agents]
# The ACP connector each worker is started with. claude_browser has Claude in Chrome switched on and
# is only used for steps that need your signed-in browser (one at a time, across all sessions).
claude = ["claude-agent-acp"]
claude_browser = ["claude-agent-acp"]     # started with Claude in Chrome switched on
codex = ["codex-acp"]

[effort_option]
# What each agent calls its reasoning setting.
claude = "effort"
codex = "reasoning_effort"

[browser]
# Only these agents can use your signed-in Chrome today.
signed_in = ["claude"]

# Who does what. The lead may deviate but must say why.
[[rule]]
when = "small fixes, CSS tweaks, config edits, simple scripts"
use = { agent = "codex", model = "gpt-6.1-sol", effort = "low" }
[[rule]]
when = "everyday Python, Flask, React, Shopify, API integrations, tests"
use = { agent = "codex", model = "gpt-6.1-sol", effort = "medium" }
[[rule]]
when = "multi-file features, migrations, complex integrations, performance optimisation"
use = { agent = "codex", model = "gpt-6.1-sol", effort = "high" }
[[rule]]
when = "difficult debugging, complex algorithms, PostgreSQL optimisation, backend logic, number crunching"
use = { agent = "codex", model = "gpt-6-astra", effort = "high" }
[[rule]]
when = "persistent bugs, concurrency problems, major system failures"
use = { agent = "codex", model = "gpt-6-astra", effort = "xhigh" }
[[rule]]
when = "React, MUI, HTML/CSS, documentation, general front-end development"
use = { agent = "claude", model = "sonnet", effort = "medium" }
[[rule]]
when = "complex UI design, front-end architecture, advanced JavaScript, UX improvements"
use = { agent = "claude", model = "sonnet", effort = "high" }
[[rule]]
when = "anything needing the user's signed-in browser: checking a live page, Shopify admin, logged-in sites"
use = { agent = "claude", model = "sonnet", effort = "medium", browser = true }
[[rule]]
when = "codebase analysis, technical planning, code reviews"
use = { agent = "claude", model = "opus", effort = "medium" }
[[rule]]
when = "application architecture, large refactoring, authentication, complex systems"
use = { agent = "claude", model = "opus", effort = "high" }
[[rule]]
when = "major architectural problems, particularly difficult refactoring, security investigations"
use = { agent = "claude", model = "opus", effort = "xhigh" }
[[rule]]
when = "a quick question, chat, or explanation that needs no code changes"
use = { agent = "claude", model = "sonnet", effort = "low" }

# ---------------------------------------------------------------------------------------------------------
# Permissions: what workers may do without asking you (modes "auto"; "ask" sends everything to you, and
# "unrestricted" doesn't ask at all). Checked in order deny → ask → allow; anything not covered goes to the
# gatekeeper. Patterns are "kind:glob": kinds are read, edit, delete, move, search, run, fetch, think, other.
# "@project" = only paths inside the project, "@outside" = any path outside it, "~" = your home folder.
# A chained command (;, &&, |, $(…), redirects) never matches an allow rule: the gatekeeper looks at it.
# `claudex permissions` shows these and every recent decision. A project can add its own in .claudex/rules.toml.
[permissions]
gatekeeper = { agent = "claude", model = "sonnet", effort = "low" }
deny = [
    "run:sudo *", "run:* sudo *", "run:su *", "run:doas *",
    "*:~/.ssh*", "*:~/.aws*", "*:~/.gnupg*", "*:~/.config/gh*", "*:~/.netrc*",
    "run:rm -rf /", "run:rm -rf /*", "run:rm -rf ~*", "run:* rm -rf ~*", "run:rm -rf $HOME*",
    "run:git push --force*", "run:git push -f*", "run:git push * --force*", "run:git reset --hard origin*",
    "run:*mkfs*", "run:dd *of=/dev/*", "run:*curl * | *sh*", "run:*wget * | *sh*", "run:chmod -R 777 /*",
    "edit:@outside", "delete:@outside", "move:@outside",
]
ask = [
    "run:git push*", "run:*deploy*", "run:*publish*", "run:*release*",
    "run:pip install*", "run:pip3 install*", "run:npm install*", "run:npm i *", "run:pnpm add*", "run:yarn add*",
    "run:uv add*", "run:uv pip install*", "run:cargo install*", "run:brew install*", "run:apt*", "run:dnf*",
    "run:ssh *", "run:scp *", "run:rsync *", "run:rm -r*", "run:rm -f*", "run:docker *", "run:kubectl *",
    "run:psql *", "run:mysql *", "run:redis-cli *", "run:stripe *", "run:aws *", "run:gcloud *", "run:az *",
    "run:shopify theme push*", "run:shopify app deploy*", "fetch:*",
]
allow = [
    "read:*", "search:*", "think:*", "edit:@project", "delete:@project", "move:@project",
    "run:pytest*", "run:python -m pytest*", "run:python3 -m pytest*", "run:uv run*pytest*",
    "run:npm test*", "run:npm run test*", "run:npm run lint*", "run:npm run build*", "run:npm run typecheck*",
    "run:pnpm test*", "run:pnpm run *", "run:yarn test*", "run:npx tsc*", "run:tsc*", "run:npx eslint*",
    "run:go test*", "run:go build*", "run:go vet*", "run:cargo test*", "run:cargo build*", "run:cargo check*",
    "run:make test*", "run:make check*", "run:ruff *", "run:black --check*", "run:mypy *", "run:eslint *",
    "run:git status*", "run:git diff*", "run:git log*", "run:git show*", "run:git branch*", "run:git add *",
    "run:ls*", "run:cat *", "run:head *", "run:tail *", "run:wc *", "run:grep *", "run:rg *", "run:find *",
    "run:pwd", "run:echo *", "run:which *", "run:python3 --version", "run:node --version",
]
