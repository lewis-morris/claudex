# Claudex routing rules (`claudex rules` shows them, `claudex rules --edit` opens this file). Edit freely: they are re-read on every message.
# Model names are checked against what each agent offers right now, so a renamed
# or retired model falls back to that agent's default instead of failing.

[lead]
# The planner that splits a job, picks who does each part, and does the final check
# (architect / technical lead = Claude Opus 5.5, high).
agent = "claude"
model = "opus"
effort = "high"
replan_effort = "medium"   # revising a plan after a second opinion's concerns: the first plan did the
                           # hard thinking (high took about as long as the first plan, ~90 s, for one fix)
replan_in_same_conversation = true   # Claude as lead re-plans in the conversation it planned in, sent only the
                                     # concerns (no re-reading files); the conversation is deleted afterwards
quick_followups = true    # a short reply ("carry on", "1", "A is fine", "???") goes straight back to the worker who
                          # did the last step, without planning again; false sends everything to the lead
quick_followup_hours = 12 # only when that last step was this recent
quick_questions = true    # a short plain question ("what's left?", "why did it stop?") goes to the worker already in
                          # the conversation without planning; one that asks for a change is still planned

[reviewers]
# Each side checks the other's work and gives second opinions on the other's big decisions
# (code reviewer = Claude Opus 5.5 / GPT-6 Astra, high).
claude = { model = "opus", effort = "high" }
codex = { model = "gpt-6-astra", effort = "high" }

[review]
enabled = true
max_attempts = 3          # 1st try, fix once at the same level, then one step up the ladder
max_rounds = 8            # rounds that got further (new changes, new asks) don't count against max_attempts, up to this many
skip_low_effort = false   # true: low-effort steps aren't reviewed (cheaper, less safe)
diff_limit = 60000        # characters of diff sent to the reviewer (it's told if it was cut short)
light_for_docs = true     # a step that only changed writing (.md, .txt, docs) gets a quicker, cheaper check
# Who does that lighter check (the other side from the worker, as always). Code always gets the full reviewers.
light = { claude = { model = "sonnet", effort = "medium" }, codex = { model = "gpt-6.1-sol", effort = "medium" } }
small_diff = 8000         # a change this small (and 3 files or fewer) gets the same reviewer at small_effort;
small_effort = "medium"   # re-checks after a fix always get the full effort. 0 turns this off
recheck_fixes_only = true # a re-check after fixes is sent only the fixes (it saw the whole step last time)

[checks]
if_unavailable = "stop"   # if a review/second opinion can't run (login, model, timeout): "stop" or "continue"

[final_check]
enabled = true            # after a job with more than one step, the lead checks the parts fit together
diff_limit = 15000        # characters of the whole job's diff it's sent (each step's diff was reviewed in full)
when = "mixed"            # "mixed": only when more than one agent worked, or a step wasn't cleanly reviewed; "always"
effort = "medium"         # every step it looks at has already passed a full review; "" uses the lead's own effort

[memory]
update_map = true         # refresh .claudex/project/map.md after a job that changed files
map_when = "structural"   # "structural": only when files were added, deleted or renamed, or build/run/deploy
                          # files changed (edits inside existing files don't change the layout); "always"
native_instructions = true  # Claude loads CLAUDE.md and Codex loads AGENTS.md themselves, so each is sent only
                            # the other's file; false pastes both into every prompt
map_model = { agent = "codex", model = "gpt-6.1-sol", effort = "low" }

[limits]
plan_timeout_min = 10
check_timeout_min = 15
step_timeout_min = 180     # a last backstop: a worker still busy after this long is stopped anyway
step_idle_min = 20         # a worker that shows no sign of work for this long is stopped (it's stuck)
step_idle_tool_min = 60    # ... allowed this long when one of its actions (a build, a test run) is still running
fresh_worker_at = 0.7     # a worker whose conversation is this full starts the next step fresh (0 = never)
usage_limit_wait_min = 30   # after an agent hits its usage limit, route around it for this long

[parallel]
# Several Claudex conversations can work in one project at once. Planning and answering never wait. When
# another job is already changing files, this one works in a separate copy (a git worktree, made from the last
# commit) and brings its changes back when it's done; if they clash, the copy is kept and the files named.
worktrees = true
dont_link = []     # ignored files and folders not to link into a copy (installed packages and .env files are)

[ladder]
# Where a worker steps up to when its work keeps failing review. Never Max.
codex = [["gpt-6.1-sol", "low"], ["gpt-6.1-sol", "medium"], ["gpt-6.1-sol", "high"], ["gpt-6-astra", "high"], ["gpt-6-astra", "xhigh"]]
claude = [["sonnet", "medium"], ["sonnet", "high"], ["opus", "medium"], ["opus", "high"], ["opus", "xhigh"]]

[defaults]
# Used when no rule clearly fits.
agent = "codex"
model = "gpt-6.1-sol"
effort = "medium"

[agent_defaults]
# Used when you force one agent ("Claude only" / "Codex only", or start with @claude / @codex).
claude = { model = "opus", effort = "medium" }
codex = { model = "gpt-6.1-sol", effort = "medium" }

[agents]
# The ACP connector each worker is started with. claude_browser has Claude in Chrome switched on and
# is only used for steps that need your signed-in browser (one at a time, across all sessions).
claude = ["claude-agent-acp"]
claude_browser = ["claude-agent-acp"]     # started with Claude in Chrome switched on
codex = ["codex-acp"]

[effort_option]
# What each agent calls its reasoning setting.
claude = "effort"
codex = "reasoning_effort"

[browser]
# Only these agents can use your signed-in Chrome today.
signed_in = ["claude"]

# Who does what. The lead may deviate but must say why.
[[rule]]
when = "small fixes, CSS tweaks, config edits, simple scripts"
use = { agent = "codex", model = "gpt-6.1-sol", effort = "low" }
[[rule]]
when = "everyday Python, Flask, React, Shopify, API integrations, tests"
use = { agent = "codex", model = "gpt-6.1-sol", effort = "medium" }
[[rule]]
when = "multi-file features, migrations, complex integrations, performance optimisation"
use = { agent = "codex", model = "gpt-6.1-sol", effort = "high" }
[[rule]]
when = "difficult debugging, complex algorithms, PostgreSQL optimisation, backend logic, number crunching"
use = { agent = "codex", model = "gpt-6-astra", effort = "high" }
[[rule]]
when = "persistent bugs, concurrency problems, major system failures"
use = { agent = "codex", model = "gpt-6-astra", effort = "xhigh" }
[[rule]]
when = "React, MUI, HTML/CSS, documentation, general front-end development"
use = { agent = "claude", model = "sonnet", effort = "medium" }
[[rule]]
when = "complex UI design, front-end architecture, advanced JavaScript, UX improvements"
use = { agent = "claude", model = "sonnet", effort = "high" }
[[rule]]
when = "anything needing the user's signed-in browser: checking a live page, Shopify admin, logged-in sites"
use = { agent = "claude", model = "sonnet", effort = "medium", browser = true }
[[rule]]
when = "codebase analysis, technical planning, code reviews"
use = { agent = "claude", model = "opus", effort = "medium" }
[[rule]]
when = "application architecture, large refactoring, authentication, complex systems"
use = { agent = "claude", model = "opus", effort = "high" }
[[rule]]
when = "major architectural problems, particularly difficult refactoring, security investigations"
use = { agent = "claude", model = "opus", effort = "xhigh" }
[[rule]]
when = "a quick question, chat, or explanation that needs no code changes"
use = { agent = "claude", model = "sonnet", effort = "low" }

# ---------------------------------------------------------------------------------------------------------
# Permissions: what workers may do without asking you (modes "auto"; "ask" sends everything to you, and
# "unrestricted" doesn't ask at all). Checked in order deny → ask → allow; anything not covered goes to the
# gatekeeper. Patterns are "kind:glob": kinds are read, edit, delete, move, search, run, fetch, think, other.
# "@project" = only paths inside the project, "@outside" = any path outside it, "~" = your home folder.
# A chained command (;, &&, |, $(…), redirects) never matches an allow rule: the gatekeeper looks at it.
# Reading web pages (fetch) isn't in any list, so the gatekeeper decides: usually yes for public pages.
# `claudex permissions` shows these and every recent decision. A project can add its own in .claudex/rules.toml.
[permissions]
gatekeeper = { agent = "claude", model = "sonnet", effort = "low" }
# Installing packages. "project": installs into this project's own environment (.venv, node_modules) just
# happen; "ask": every install asks you. Installs onto the whole computer (global, --user, brew, cargo install,
# a bare pip install) always ask. Change it with /permissions installs project|ask.
installs = "project"
project_installs = [
    "run:*.venv/bin/pip install*", "run:*.venv/bin/pip3 install*", "run:*.venv/bin/python* -m pip install*",
    "run:*venv/bin/pip install*", "run:uv add*", "run:uv pip install*", "run:uv sync*",
    "run:npm install*", "run:npm i *", "run:npm i", "run:npm ci*", "run:pnpm add*", "run:pnpm install*", "run:pnpm i*",
    "run:yarn add*", "run:yarn install*", "run:yarn", "run:bun add*", "run:bun install*", "run:poetry add*", "run:poetry install*",
]
computer_installs = [
    "run:pip install*", "run:pip3 install*", "run:python* -m pip install*", "run:* --user*", "run:* -g *", "run:* -g",
    "run:* --global*", "run:* --system*", "run:* --break-system-packages*", "run:cargo install*", "run:brew install*",
    "run:pipx install*", "run:npm link*", "run:gem install*", "run:go install*",
]
deny = [
    "run:sudo *", "run:* sudo *", "run:su *", "run:doas *",
    "*:~/.ssh*", "*:~/.aws*", "*:~/.gnupg*", "*:~/.config/gh*", "*:~/.netrc*",
    "run:rm -rf /", "run:rm -rf /*", "run:rm -rf ~*", "run:* rm -rf ~*", "run:rm -rf $HOME*",
    "run:git push --force*", "run:git push -f*", "run:git push * --force*", "run:git reset --hard origin*",
    "run:*mkfs*", "run:dd *of=/dev/*", "run:*curl * | *sh*", "run:*wget * | *sh*", "run:chmod -R 777 /*",
    "edit:@outside", "delete:@outside", "move:@outside",
]
ask = [
    "run:git push*", "run:*deploy*", "run:*publish*", "run:*release*",
    "run:apt*", "run:dnf*",
    "run:ssh *", "run:scp *", "run:rsync *", "run:rm -r*", "run:rm -f*", "run:docker *", "run:kubectl *",
    "run:git branch -d*", "run:git branch -D*", "run:find *",
    "run:psql *", "run:mysql *", "run:redis-cli *", "run:stripe *", "run:aws *", "run:gcloud *", "run:az *",
    "run:shopify theme push*", "run:shopify app deploy*",
]
allow = [
    "read:*", "search:*", "think:*", "edit:@project", "delete:@project", "move:@project",
    "run:pytest*", "run:python -m pytest*", "run:python3 -m pytest*", "run:uv run*pytest*",
    "run:npm test*", "run:npm run test*", "run:npm run lint*", "run:npm run build*", "run:npm run typecheck*",
    "run:pnpm test*", "run:pnpm run *", "run:yarn test*", "run:npx tsc*", "run:tsc*", "run:npx eslint*",
    "run:go test*", "run:go build*", "run:go vet*", "run:cargo test*", "run:cargo build*", "run:cargo check*",
    "run:make test*", "run:make check*", "run:ruff *", "run:black --check*", "run:mypy *", "run:eslint *",
    "run:git status", "run:git status *", "run:git diff", "run:git diff *", "run:git log", "run:git log *", "run:git show", "run:git show *", "run:git branch", "run:git branch -a",
    "run:git branch -v*", "run:git branch --list*", "run:git add *",
    "run:ls*", "run:cat *", "run:head *", "run:tail *", "run:wc *", "run:grep *", "run:rg *",
    "run:pwd", "run:echo *", "run:which *", "run:python3 --version", "run:node --version",
    # The separate test browser (Playwright): looking at pages and using them like a person would. Running
    # scripts in a page and uploading files still go to the gatekeeper.
    "other:*playwright*browser_snapshot*", "other:*playwright*browser_take_screenshot*",
    "other:*playwright*browser_navigate*", "other:*playwright*browser_click*", "other:*playwright*browser_type*",
    "other:*playwright*browser_hover*", "other:*playwright*browser_press_key*", "other:*playwright*browser_wait_for*",
    "other:*playwright*browser_select_option*", "other:*playwright*browser_resize*", "other:*playwright*browser_tabs*",
    "other:*playwright*browser_console_messages*", "other:*playwright*browser_network_requests*",
    "other:*playwright*browser_fill_form*", "other:*playwright*browser_find*", "other:*playwright*browser_close*",
    # Your signed-in Chrome: only looking. A click there can do something real in your accounts, so the
    # gatekeeper decides those.
    "other:*chrome-devtools*take_snapshot*", "other:*chrome-devtools*take_screenshot*",
    "other:*chrome-devtools*list_*", "other:*chrome-devtools*get_*",
]
